<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morning Ritual ✨</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #fdf6f0 0%, #f0e6ff 50%, #e6f7ff 100%);
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(200,180,255,0.3);
      padding: 18px 24px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .header-sub { font-size: 11px; letter-spacing: 4px; color: #9b72cf; text-transform: uppercase; margin-bottom: 2px; }
    .header-title { font-size: 26px; font-weight: bold; color: #2d1b69; letter-spacing: -1px; }
    .header-tagline { font-size: 12px; color: #888; margin-top: 2px; }

    .tabs {
      display: flex; gap: 4px; margin: 20px 0 0;
      background: rgba(255,255,255,0.6); border-radius: 50px;
      padding: 4px; border: 1px solid rgba(200,180,255,0.4);
    }
    .tab-btn {
      padding: 8px 22px; border-radius: 50px; border: none; cursor: pointer;
      font-size: 13px; font-family: Georgia, serif;
      background: transparent; color: #666;
      transition: all 0.2s; font-weight: normal;
    }
    .tab-btn.active { background: #7c3aed; color: #fff; font-weight: bold; }

    .content { width: 100%; max-width: 480px; padding: 20px 20px 40px; }

    /* PICK TAB */
    #tab-pick { text-align: center; }
    .result-card {
      min-height: 200px;
      border-radius: 24px;
      border: 2px solid rgba(200,180,255,0.4);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px 24px; margin-bottom: 24px;
      background: rgba(255,255,255,0.7);
      transition: background 0.15s, border-color 0.15s;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .result-card .idle-emoji { font-size: 48px; margin-bottom: 12px; }
    .result-card .idle-text { font-size: 16px; color: #aaa; font-style: italic; }
    .result-card .activity-emoji { font-size: 56px; margin-bottom: 12px; }
    .result-card .activity-name { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
    .result-card .activity-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
      padding: 4px 14px; border-radius: 20px; font-weight: bold;
    }
    .spin-btn {
      background: linear-gradient(135deg, #7c3aed, #be185d);
      color: #fff; border: none; border-radius: 50px;
      padding: 16px 48px; font-size: 16px; font-family: Georgia, serif;
      font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 20px rgba(124,58,237,0.35);
      transition: all 0.2s; letter-spacing: 0.5px;
    }
    .spin-btn:disabled { background: #ccc; box-shadow: none; cursor: default; }

    .prob-section { margin-top: 32px; text-align: left; }
    .prob-label { font-size: 11px; letter-spacing: 3px; color: #999; text-transform: uppercase; margin-bottom: 12px; }
    .prob-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .prob-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .prob-name { font-size: 13px; color: #555; flex: 1; }
    .prob-pct { font-size: 13px; color: #333; font-weight: bold; }
    .prob-bar-bg { flex: 2; height: 6px; background: #eee; border-radius: 3px; overflow: hidden; }
    .prob-bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }

    /* MANAGE TAB */
    .manage-hint { font-size: 13px; color: #888; margin-bottom: 16px; font-style: italic; }
    .activity-card {
      background: rgba(255,255,255,0.8); border-radius: 16px;
      padding: 14px 16px; margin-bottom: 10px;
    }
    .activity-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
    .activity-card-emoji { font-size: 22px; }
    .activity-card-info { flex: 1; }
    .activity-card-name { font-size: 14px; font-weight: bold; color: #1a1a2e; }
    .activity-card-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    .activity-card-pct { font-size: 13px; font-weight: bold; }
    .delete-btn { background: none; border: none; cursor: pointer; font-size: 16px; color: #ccc; padding: 2px; }
    .weight-slider { width: 100%; margin: 4px 0; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 10px; color: #bbb; }

    .add-btn {
      width: 100%; padding: 14px; border-radius: 16px;
      border: 2px dashed rgba(124,58,237,0.3);
      background: rgba(255,255,255,0.5);
      color: #9b72cf; font-size: 14px; font-family: Georgia, serif;
      cursor: pointer; margin-top: 8px;
    }
    .add-form {
      background: rgba(255,255,255,0.9); border-radius: 16px;
      padding: 16px; border: 1px solid rgba(124,58,237,0.2); margin-top: 8px;
    }
    .add-form-title { font-size: 14px; font-weight: bold; color: #2d1b69; margin-bottom: 12px; }
    .add-form input, .add-form select {
      padding: 8px 12px; border-radius: 10px; border: 1px solid #ddd;
      font-family: Georgia, serif; font-size: 14px;
    }
    .add-form .name-input { width: 100%; margin-bottom: 8px; }
    .add-form .row { display: flex; gap: 8px; margin-bottom: 8px; }
    .add-form .emoji-input { width: 70px; }
    .add-form .cat-select { flex: 1; }
    .add-form .weight-label { font-size: 12px; color: #888; margin-bottom: 4px; }
    .add-form .weight-range { width: 100%; margin-bottom: 12px; accent-color: #7c3aed; }
    .add-form .form-btns { display: flex; gap: 8px; }
    .confirm-btn {
      flex: 1; padding: 10px; background: #7c3aed; color: #fff;
      border: none; border-radius: 10px; font-size: 14px;
      cursor: pointer; font-family: Georgia, serif;
    }
    .cancel-btn {
      flex: 1; padding: 10px; background: #f0f0f0; color: #666;
      border: none; border-radius: 10px; font-size: 14px;
      cursor: pointer; font-family: Georgia, serif;
    }

    /* HISTORY TAB */
    .history-empty { text-align: center; padding: 48px 0; color: #bbb; font-style: italic; }
    .history-hint { font-size: 13px; color: #888; margin-bottom: 16px; font-style: italic; }
    .history-item {
      display: flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.7); border-radius: 14px;
      padding: 12px 16px; margin-bottom: 8px;
    }
    .history-emoji { font-size: 24px; }
    .history-info { flex: 1; }
    .history-name { font-size: 14px; color: #1a1a2e; font-weight: bold; }
    .history-cat { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
    .history-date { font-size: 12px; color: #bbb; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="header-sub">your daily</div>
  <div class="header-title">Morning Ritual ✨</div>
  <div class="header-tagline">15 minutes for you</div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('pick')">🎯 Pick</button>
  <button class="tab-btn" onclick="switchTab('manage')">⚙️ Manage</button>
  <button class="tab-btn" onclick="switchTab('history')">📅 History</button>
</div>

<div class="content">

  <!-- PICK TAB -->
  <div id="tab-pick">
    <div class="result-card" id="result-card">
      <div class="idle-emoji">🌅</div>
      <div class="idle-text">tap below to find out what<br>the universe has planned</div>
    </div>
    <button class="spin-btn" id="spin-btn" onclick="spin()">🌸 what's my activity?</button>
    <div class="prob-section">
      <div class="prob-label">probability breakdown</div>
      <div id="prob-rows"></div>
    </div>
  </div>

  <!-- MANAGE TAB -->
  <div id="tab-manage" class="hidden">
    <div class="manage-hint">Higher weight = higher chance. Drag sliders to adjust. Exercise is boosted by default 💪</div>
    <div id="activity-list"></div>
    <button class="add-btn" id="add-btn" onclick="showAddForm()">+ add an activity</button>
    <div class="add-form hidden" id="add-form">
      <div class="add-form-title">New Activity</div>
      <input class="name-input" type="text" placeholder="Activity name" id="new-name" />
      <div class="row">
        <input class="emoji-input" type="text" placeholder="Emoji" id="new-emoji" value="⭐" />
        <select class="cat-select" id="new-cat"></select>
      </div>
      <div class="weight-label" id="new-weight-label">Weight: 10</div>
      <input class="weight-range" type="range" min="1" max="50" value="10" id="new-weight"
        oninput="document.getElementById('new-weight-label').textContent = 'Weight: ' + this.value" />
      <div class="form-btns">
        <button class="confirm-btn" onclick="addActivity()">Add ✨</button>
        <button class="cancel-btn" onclick="hideAddForm()">Cancel</button>
      </div>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" class="hidden">
    <div id="history-content"></div>
  </div>

</div>

<script>
  const CATEGORY_COLORS = {
    exercise:    { bg: "#d4f5e2", accent: "#1a7a45", label: "Exercise" },
    mindfulness: { bg: "#e8d9f7", accent: "#7c3aed", label: "Mindfulness" },
    golden:      { bg: "#fff3c4", accent: "#b45309", label: "✨ Golden Ticket" },
    mind:        { bg: "#dbeafe", accent: "#1d4ed8", label: "Mind" },
    "self-care": { bg: "#fce7f3", accent: "#be185d", label: "Self-care" },
  };

  const DEFAULT_ACTIVITIES = [
    { id: 1,  name: "Morning walk or jog",   category: "exercise",    weight: 20, emoji: "🏃‍♀️" },
    { id: 2,  name: "Yoga or stretching",    category: "exercise",    weight: 18, emoji: "🧘‍♀️" },
    { id: 3,  name: "Dance it out",          category: "exercise",    weight: 15, emoji: "💃" },
    { id: 4,  name: "Bodyweight workout",    category: "exercise",    weight: 15, emoji: "💪" },
    { id: 5,  name: "Meditation",            category: "mindfulness", weight: 10, emoji: "🌸" },
    { id: 6,  name: "Journaling",            category: "mindfulness", weight: 8,  emoji: "📓" },
    { id: 7,  name: "Go back to bed ✨",     category: "golden",      weight: 3,  emoji: "🛌" },
    { id: 8,  name: "Read a book",           category: "mind",        weight: 6,  emoji: "📚" },
    { id: 9,  name: "Cold splash + skincare",category: "self-care",   weight: 7,  emoji: "💧" },
    { id: 10, name: "Sketching",             category: "mind",        weight: 7,  emoji: "✏️" },
    { id: 11, name: "Piano",                 category: "mind",        weight: 7,  emoji: "🎹" },
    { id: 12, name: "Learn a language",      category: "mind",        weight: 7,  emoji: "🌍" },
  ];

  let activities = [];
  let history = [];
  let spinning = false;
  let currentTab = 'pick';

  function load() {
    const saved = localStorage.getItem("wellness_activities");
    activities = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(DEFAULT_ACTIVITIES));
    const savedHistory = localStorage.getItem("wellness_history");
    history = savedHistory ? JSON.parse(savedHistory) : [];
    populateCatSelect();
    renderProbs();
    renderActivities();
    renderHistory();
  }

  function save() {
    localStorage.setItem("wellness_activities", JSON.stringify(activities));
  }

  function total() {
    return activities.reduce((s, a) => s + a.weight, 0);
  }

  function weightedRandom() {
    let r = Math.random() * total();
    for (const a of activities) {
      r -= a.weight;
      if (r <= 0) return a;
    }
    return activities[activities.length - 1];
  }

  function switchTab(tab) {
    currentTab = tab;
    ['pick','manage','history'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
    });
    document.querySelectorAll('.tab-btn').forEach((btn, i) => {
      btn.classList.toggle('active', ['pick','manage','history'][i] === tab);
    });
    if (tab === 'pick') renderProbs();
    if (tab === 'manage') renderActivities();
    if (tab === 'history') renderHistory();
  }

  function setCard(activity) {
    const card = document.getElementById('result-card');
    if (!activity) {
      card.style.background = 'rgba(255,255,255,0.7)';
      card.style.border = '2px solid rgba(200,180,255,0.4)';
      card.style.boxShadow = '0 4px 20px rgba(0,0,0,0.06)';
      card.innerHTML = '<div class="idle-emoji">🌅</div><div class="idle-text">tap below to find out what<br>the universe has planned</div>';
      return;
    }
    const c = CATEGORY_COLORS[activity.category] || { bg: '#f9f9f9', accent: '#ccc', label: activity.category };
    card.style.background = c.bg;
    card.style.border = `2px solid ${c.accent}`;
    card.style.boxShadow = `0 8px 32px ${c.accent}33`;
    card.innerHTML = `
      <div class="activity-emoji">${activity.emoji}</div>
      <div class="activity-name" style="color:${c.accent}">${activity.name}</div>
      <div class="activity-label" style="background:${c.accent}22; color:${c.accent}">${c.label}</div>
    `;
  }

  function spin() {
    if (spinning) return;
    spinning = true;
    const btn = document.getElementById('spin-btn');
    btn.disabled = true;
    btn.textContent = 'choosing...';
    setCard(null);
    let count = 0;
    const flicker = setInterval(() => {
      const random = activities[Math.floor(Math.random() * activities.length)];
      setCard(random);
      count++;
      if (count > 12) {
        clearInterval(flicker);
        const final = weightedRandom();
        setCard(final);
        spinning = false;
        btn.disabled = false;
        btn.textContent = '✨ pick again';
        const entry = { ...final, date: new Date().toLocaleDateString() };
        history = [entry, ...history].slice(0, 30);
        localStorage.setItem("wellness_history", JSON.stringify(history));
      }
    }, 80);
  }

  function renderProbs() {
    const t = total();
    const container = document.getElementById('prob-rows');
    container.innerHTML = '';
    Object.entries(CATEGORY_COLORS).forEach(([cat, style]) => {
      const catTotal = activities.filter(a => a.category === cat).reduce((s, a) => s + a.weight, 0);
      if (catTotal === 0) return;
      const pct = Math.round((catTotal / t) * 100);
      container.innerHTML += `
        <div class="prob-row">
          <div class="prob-dot" style="background:${style.accent}"></div>
          <div class="prob-name">${style.label}</div>
          <div class="prob-pct">${pct}%</div>
          <div class="prob-bar-bg"><div class="prob-bar-fill" style="width:${pct}%;background:${style.accent}"></div></div>
        </div>`;
    });
  }

  function renderActivities() {
    const t = total();
    const list = document.getElementById('activity-list');
    list.innerHTML = '';
    activities.forEach(a => {
      const c = CATEGORY_COLORS[a.category] || { bg: '#f9f9f9', accent: '#666', label: a.category };
      const pct = Math.round((a.weight / t) * 100);
      list.innerHTML += `
        <div class="activity-card" style="border:1px solid ${c.accent}33">
          <div class="activity-card-top">
            <span class="activity-card-emoji">${a.emoji}</span>
            <div class="activity-card-info">
              <div class="activity-card-name">${a.name}</div>
              <div class="activity-card-cat" style="color:${c.accent}">${c.label}</div>
            </div>
            <div class="activity-card-pct" style="color:${c.accent}">${pct}%</div>
            <button class="delete-btn" onclick="deleteActivity(${a.id})">✕</button>
          </div>
          <input class="weight-slider" type="range" min="0" max="50" value="${a.weight}"
            style="accent-color:${c.accent}"
            oninput="updateWeight(${a.id}, this.value)" />
          <div class="slider-labels"><span>rare</span><span>weight: ${a.weight}</span><span>common</span></div>
        </div>`;
    });
  }

  function updateWeight(id, val) {
    activities = activities.map(a => a.id === id ? { ...a, weight: Math.max(0, Math.min(100, Number(val))) } : a);
    save();
    renderProbs();
    renderActivities();
  }

  function deleteActivity(id) {
    activities = activities.filter(a => a.id !== id);
    save();
    renderProbs();
    renderActivities();
  }

  function populateCatSelect() {
    const sel = document.getElementById('new-cat');
    sel.innerHTML = Object.entries(CATEGORY_COLORS)
      .map(([cat, s]) => `<option value="${cat}">${s.label}</option>`).join('');
  }

  function showAddForm() {
    document.getElementById('add-btn').classList.add('hidden');
    document.getElementById('add-form').classList.remove('hidden');
  }

  function hideAddForm() {
    document.getElementById('add-btn').classList.remove('hidden');
    document.getElementById('add-form').classList.add('hidden');
  }

  function addActivity() {
    const name = document.getElementById('new-name').value.trim();
    if (!name) return;
    const emoji = document.getElementById('new-emoji').value || '⭐';
    const category = document.getElementById('new-cat').value;
    const weight = Number(document.getElementById('new-weight').value);
    activities.push({ id: Date.now(), name, emoji, category, weight });
    save();
    document.getElementById('new-name').value = '';
    document.getElementById('new-emoji').value = '⭐';
    document.getElementById('new-weight').value = 10;
    document.getElementById('new-weight-label').textContent = 'Weight: 10';
    hideAddForm();
    renderActivities();
    renderProbs();
  }

  function renderHistory() {
    const container = document.getElementById('history-content');
    if (history.length === 0) {
      container.innerHTML = '<div class="history-empty">No history yet! Go pick your first activity 🌸</div>';
      return;
    }
    container.innerHTML = '<div class="history-hint">Your recent morning rituals ☀️</div>' +
      history.map(h => {
        const c = CATEGORY_COLORS[h.category] || { bg: '#f9f9f9', accent: '#666', label: h.category };
        return `
          <div class="history-item" style="border:1px solid ${c.accent}22">
            <span class="history-emoji">${h.emoji}</span>
            <div class="history-info">
              <div class="history-name">${h.name}</div>
              <div class="history-cat" style="color:${c.accent}">${c.label}</div>
            </div>
            <div class="history-date">${h.date}</div>
          </div>`;
      }).join('');
  }

  load();
</script>
</body>
</html>
